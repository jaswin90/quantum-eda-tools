<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<script>try{var t=localStorage.getItem('site-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ROOT}}vendor/katex/katex.min.css">
<link rel="stylesheet" href="{{ROOT}}assets/css/book.css">
<script defer src="{{ROOT}}assets/js/book.js"></script>
<script defer src="{{ROOT}}vendor/katex/katex.min.js"></script>
<script defer src="{{ROOT}}vendor/katex/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (!window.renderMathInElement) return;
  renderMathInElement(document.querySelector("main"), {
    delimiters: [
      {left: "$$", right: "$$", display: true},
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false,
    macros: {
      "\\ket": "\\left|#1\\right\\rangle",
      "\\bra": "\\left\\langle#1\\right|",
      "\\braket": "\\left\\langle#1\\middle|#2\\right\\rangle",
      "\\ketbra": "\\left|#1\\right\\rangle\\!\\left\\langle#2\\right|",
      "\\expval": "\\left\\langle#1\\right\\rangle",
      "\\dd": "\\mathrm{d}",
      "\\Tr": "\\operatorname{Tr}",
      "\\dag": "^{\\dagger}",
      "\\RR": "\\mathbb{R}",
      "\\CC": "\\mathbb{C}",
      "\\ii": "\\mathrm{i}",
      "\\ee": "\\mathrm{e}",
      "\\Re": "\\operatorname{Re}",
      "\\Im": "\\operatorname{Im}"
    }
  });
});
</script>
</head>
<body>
<header class="topbar">
<a class="brand" href="index.html">{{BRAND}}</a>
<span class="spacer"></span>
<nav>{{NAV}}</nav>
<button class="btn icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
</header>
<div class="layout">
<nav class="toc" aria-label="Contents">
  <p class="toc-title">Contents</p>
  <ol>
{{TOC}}
  </ol>
</nav>
<main>
<article>
{{HEADER}}
{{BODY}}
{{REFSECTION}}
{{PAGER}}
<footer class="page-footer">
  <p>{{SERIES}}. Source: <code>{{SOURCE}}</code>. Rebuild with <code>make</code>; figures are computed by <code>scripts/make_foundation_figures.py</code>. Built {{BUILD_DATE}}.</p>
</footer>
</article>
</main>
</div>
</body>
</html>
