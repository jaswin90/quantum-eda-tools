<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img" aria-label="The nine-stage design-to-fabrication flow, a shared die record beneath it, and three feedback loops from test and operation back to design." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><title>The nine-stage design-to-fabrication flow, a shared die record beneath it, and three feedback loops from test and operation back to design.</title><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a8f98"/></marker><marker id="ah1F5FE0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1F5FE0"/></marker><marker id="ahB84E14" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B84E14"/></marker><marker id="ah0E8A7A" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0E8A7A"/></marker></defs><rect width="1120" height="470" fill="#fcfcfb"/><rect x="20.0" y="70" width="104" height="56" rx="8" fill="#eef3fd" stroke="#8a8f98" stroke-width="1.2"/><text x="72.0" y="104" font-size="15" fill="#1d222b" text-anchor="middle" font-weight="600">Spec θ*</text><rect x="142.0" y="70" width="104" height="56" rx="8" fill="#eef3fd" stroke="#8a8f98" stroke-width="1.2"/><text x="194.0" y="104" font-size="15" fill="#1d222b" text-anchor="middle" font-weight="600">Circuit</text><line x1="126.0" y1="98" x2="139.0" y2="98" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/><rect x="264.0" y="70" width="104" height="56" rx="8" fill="#eef3fd" stroke="#8a8f98" stroke-width="1.2"/><text x="316.0" y="104" font-size="15" fill="#1d222b" text-anchor="middle" font-weight="600">Layout x</text><line x1="248.0" y1="98" x2="261.0" y2="98" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/><rect x="386.0" y="70" width="104" height="56" rx="8" fill="#eef3fd" stroke="#8a8f98" stroke-width="1.2"/><text x="438.0" y="104" font-size="15" fill="#1d222b" text-anchor="middle" font-weight="600">Extract θ(x)</text><line x1="370.0" y1="98" x2="383.0" y2="98" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/><rect x="508.0" y="70" width="104" height="56" rx="8" fill="#eef3fd" stroke="#8a8f98" stroke-width="1.2"/><text x="560.0" y="104" font-size="15" fill="#1d222b" text-anchor="middle" font-weight="600">Sign-off</text><line x1="492.0" y1="98" x2="505.0" y2="98" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/><rect x="630.0" y="70" width="104" height="56" rx="8" fill="#fbefe7" stroke="#8a8f98" stroke-width="1.2"/><text x="682.0" y="104" font-size="15" fill="#1d222b" text-anchor="middle" font-weight="600">Fabricate</text><line x1="614.0" y1="98" x2="627.0" y2="98" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/><rect x="752.0" y="70" width="104" height="56" rx="8" fill="#fbefe7" stroke="#8a8f98" stroke-width="1.2"/><text x="804.0" y="104" font-size="15" fill="#1d222b" text-anchor="middle" font-weight="600">Warm test</text><line x1="736.0" y1="98" x2="749.0" y2="98" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/><rect x="874.0" y="70" width="104" height="56" rx="8" fill="#e7f4f2" stroke="#8a8f98" stroke-width="1.2"/><text x="926.0" y="104" font-size="15" fill="#1d222b" text-anchor="middle" font-weight="600">Cold test</text><line x1="858.0" y1="98" x2="871.0" y2="98" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/><rect x="996.0" y="70" width="104" height="56" rx="8" fill="#e7f4f2" stroke="#8a8f98" stroke-width="1.2"/><text x="1048.0" y="104" font-size="15" fill="#1d222b" text-anchor="middle" font-weight="600">Calibrate</text><line x1="980.0" y1="98" x2="993.0" y2="98" stroke="#8a8f98" stroke-width="1.6" marker-end="url(#ah)"/><text x="20.0" y="48" font-size="14" fill="#1F5FE0" font-weight="600">DESIGN</text><text x="630.0" y="48" font-size="14" fill="#B84E14" font-weight="600">BUILD</text><text x="874.0" y="48" font-size="14" fill="#0E8A7A" font-weight="600">OPERATE</text><rect x="20.0" y="250" width="1080.0" height="64" rx="10" fill="#1d222b"/><text x="560.0" y="278" font-size="17" fill="#f5f3ec" text-anchor="middle" font-weight="600">Die record: targets θ*, layout x, extracted θ ± Σθ, process history, Rₙ map, cold results, calibrated values</text><text x="560.0" y="300" font-size="14" fill="#c8cfdb" text-anchor="middle">every stage reads and writes one shared, versioned record</text><line x1="72.0" y1="128" x2="72.0" y2="246" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="194.0" y1="128" x2="194.0" y2="246" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="316.0" y1="128" x2="316.0" y2="246" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="438.0" y1="128" x2="438.0" y2="246" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="560.0" y1="128" x2="560.0" y2="246" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="682.0" y1="128" x2="682.0" y2="246" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="804.0" y1="128" x2="804.0" y2="246" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="926.0" y1="128" x2="926.0" y2="246" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="1048.0" y1="128" x2="1048.0" y2="246" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="3 4"/><path d="M 804.0 316 L 804.0 346 L 72.0 346 L 72.0 320" fill="none" stroke="#B84E14" stroke-width="2.2" marker-end="url(#ahB84E14)"/><text x="438.0" y="364" font-size="14" fill="#B84E14" text-anchor="middle" font-weight="600">Loop 1: measured Σₓ → frequency plan and sign-off limits</text><path d="M 926.0 316 L 926.0 386 L 438.0 386 L 438.0 320" fill="none" stroke="#0E8A7A" stroke-width="2.2" marker-end="url(#ah0E8A7A)"/><text x="682.0" y="404" font-size="14" fill="#0E8A7A" text-anchor="middle" font-weight="600">Loop 2: cold results → recalibrate extraction and loss models</text><path d="M 1048.0 316 L 1048.0 426 L 560.0 426 L 560.0 320" fill="none" stroke="#1F5FE0" stroke-width="2.2" marker-end="url(#ah1F5FE0)"/><text x="804.0" y="444" font-size="14" fill="#1F5FE0" text-anchor="middle" font-weight="600">Loop 3: drift and crosstalk in operation → new design rules</text></svg>
